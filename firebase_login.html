<!DOCTYPE html>
<html>
<head>
  <title>Login - ChatLLM by Mr. K</title>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js"></script>
</head>
<body>
  <h2>Sign in to ChatLLM by Mr. K</h2>
  <button onclick="googleLogin()">Sign in with Google</button>
  <p><strong>Your Firebase ID Token (paste into Streamlit app):</strong></p>
  <textarea id="tokenOutput" rows="6" cols="60" readonly></textarea>

  <script>
    // Your Firebase config — replace with your actual Firebase project config
    const firebaseConfig = {
      apiKey: "AIzaSyCL86h58Js45ZR4y3uOvRzyRLHNywTTpXs",
      authDomain: "chatllm-by-mr-k.firebaseapp.com",
      projectId: "chatllm-by-mr-k",
      storageBucket: "chatllm-by-mr-k.firebasestorage.app",
      messagingSenderId: "912947847110",
      appId: "1:912947847110:web:abdddc207c39597eb05cc7"
    };

    // Initialize Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    async function googleLogin() {
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        const result = await auth.signInWithPopup(provider);
        const token = await result.user.getIdToken();
        document.getElementById("tokenOutput").value = token;
      } catch (error) {
        console.error("Login failed", error);
        alert("Login failed. Check the console for details.");
      }
    }
  </script>
</body>
</html>
